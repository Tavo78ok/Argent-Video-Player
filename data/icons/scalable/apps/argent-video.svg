<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg" cx="42%" cy="24%" r="95%">
      <stop offset="0" stop-color="#20509c"/>
      <stop offset="0.5" stop-color="#123a75"/>
      <stop offset="1" stop-color="#050f24"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8d8ff"/>
      <stop offset="0.5" stop-color="#4f9cf5"/>
      <stop offset="1" stop-color="#123f86"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7cc0ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7cc0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <!-- placa -->
  <rect width="120" height="120" x="4" y="4" rx="28" ry="28" fill="url(#bg)"/>

  <!-- halo central -->
  <circle cx="64" cy="64" r="42" fill="url(#halo)"/>

  <!-- anillo O -->
  <circle cx="64" cy="64" r="40" fill="none" stroke="#082247" stroke-opacity="0.6"
          stroke-width="10" filter="url(#soft)"/>
  <circle cx="64" cy="64" r="40" fill="none" stroke="url(#ring)" stroke-width="8"/>

  <!-- estela cometa inferior-izquierda -->
  <path d="M 56.95 101.38 A 40 40 0 0 1 24.15 67.5"
        fill="none" stroke="#9fd4ff" stroke-opacity="0.55" stroke-width="8"
        stroke-linecap="round"/>
  <path d="M 33.91 90.87 A 40 40 0 0 1 24.15 67.5"
        fill="none" stroke="#eaf5ff" stroke-opacity="0.95" stroke-width="8"
        stroke-linecap="round"/>

  <!-- triángulo play con sombra -->
  <g transform="translate(0,2)" opacity="0.28">
    <path d="M56 44 L82 64 L56 84 Z" fill="#001835"
          stroke="#001835" stroke-width="7" stroke-linejoin="round"/>
  </g>
  <path d="M56 46 L82 66 L56 86 Z" fill="#17417f"
        stroke="#17417f" stroke-width="10" stroke-linejoin="round"/>
  <path d="M57 45 L81 65 L57 85 Z" fill="#ffffff"
        stroke="#ffffff" stroke-width="7" stroke-linejoin="round"/>

  <!-- brillo superior -->
  <rect width="112" height="58" x="8" y="8" rx="22" ry="22" fill="url(#gloss)"/>

  <!-- borde -->
  <rect width="120" height="120" x="4" y="4" rx="28" ry="28"
        fill="none" stroke="#03102a" stroke-opacity="0.45" stroke-width="2"/>
</svg>
